name: devsprint
description: "DevSprint - focused AI coding sprints."
publish_to: 'none'
version: 1.2.3+6

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  google_generative_ai: ^0.4.7
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^10.3.4
  google_fonts: ^8.2.1
  dynamic_color: ^1.9.0
  flex_color_picker: ^3.8.0
  image_picker: ^1.2.3
  flutter_dotenv: ^6.0.1
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.5
  table_calendar: ^3.2.1
  file_picker: ^10.3.3
  archive: ^4.0.7
  path_provider: ^2.1.5
  supabase_flutter: ^2.8.4
  markdown_widget: ^2.3.2+8
  flutter_highlight: ^0.7.0
  workmanager: ^0.10.10
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  riverpod_generator: ^4.0.9
  flutter_launcher_icons: "^0.14.4"

flutter_launcher_icons:
  android: "ic_launcher"
  image_path: "assets/logo.png"
  min_sdk_android: 21
  windows:
    generate: true
    image_path: "assets/logo.png"
    icon_size: 48

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - .env
