name: Build release artifacts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    name: Resolve release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read application version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          version="$(sed -n 's/^version: \([0-9][0-9.]*\).*/\1/p' pubspec.yaml | head -n 1)"

          if [[ -z "$version" ]]; then
            echo "::error::Could not determine application version from pubspec.yaml"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Application version: $version"
          echo "Release tag: v$version"

  build-android:
    name: Android release APKs
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Android signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail

          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "::error::Missing ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$ANDROID_STORE_PASSWORD" || { echo "::error::Missing ANDROID_STORE_PASSWORD"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "::error::Missing ANDROID_KEY_PASSWORD"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "::error::Missing ANDROID_KEY_ALIAS"; exit 1; }

          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/devsprint-upload.jks

          cat > android/key.properties <<EOF
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=devsprint-upload.jks
          EOF

      - name: Prepare dependencies
        shell: bash
        run: |
          set -euo pipefail
          touch .env
          flutter pub get

      - name: Build split APKs
        shell: bash
        run: flutter build apk --release --split-per-abi

      - name: Build universal APK
        shell: bash
        run: flutter build apk --release

      - name: Collect Android release files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist

          cp "build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk" \
            "dist/DevSprint-v${{ needs.version.outputs.version }}-armeabi-v7a.apk"

          cp "build/app/outputs/flutter-apk/app-arm64-v8a-release.apk" \
            "dist/DevSprint-v${{ needs.version.outputs.version }}-arm64-v8a.apk"

          cp "build/app/outputs/flutter-apk/app-x86_64-release.apk" \
            "dist/DevSprint-v${{ needs.version.outputs.version }}-x86_64.apk"

          cp "build/app/outputs/flutter-apk/app-release.apk" \
            "dist/DevSprint-v${{ needs.version.outputs.version }}-universal.apk"

          ls -lh dist

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apks
          path: dist/*.apk
          if-no-files-found: error

      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f android/key.properties android/app/devsprint-upload.jks

  build-linux:
    name: Linux Ubuntu packages
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            desktop-file-utils \
            dpkg-dev \
            fakeroot \
            libfuse2 \
            libgtk-3-dev \
            libsecret-1-dev \
            libjsoncpp-dev \
            liblzma-dev \
            libstdc++-12-dev \
            locate \
            libarchive-tools \
            ninja-build \
            patchelf \
            pkg-config \
            rpm \
            zstd

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare dependencies
        shell: bash
        run: |
          set -euo pipefail
          touch .env
          flutter config --enable-linux-desktop
          flutter pub get

      - name: Build Linux release bundle
        shell: bash
        run: flutter build linux --release

      - name: Install Fastforge
        shell: bash
        run: |
          set -euo pipefail
          dart pub global activate fastforge 0.6.12
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Install AppImage tooling
        shell: bash
        run: |
          set -u

          if sudo mkdir -p /opt/appimagetool && \
             sudo curl -L --fail --silent --show-error \
               -o /opt/appimagetool/appimagetool-x86_64.AppImage \
               https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage && \
             sudo chmod +x /opt/appimagetool/appimagetool-x86_64.AppImage && \
             sudo ln -sf /opt/appimagetool/appimagetool-x86_64.AppImage /usr/local/bin/appimagetool; then
            echo "AppImage tooling installed successfully."
          else
            echo "::warning::AppImage tooling could not be installed. AppImage packaging will be skipped."
          fi

      - name: Prepare Linux packaging metadata
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            linux/packaging/deb \
            linux/packaging/rpm \
            linux/packaging/appimage

          cat > linux/packaging/deb/make_config.yaml <<'EOF'
          display_name: DevSprint
          package_name: devsprint
          maintainer:
            name: thetwodigiter
            email: thetwodigiter@users.noreply.github.com
          priority: optional
          section: devel
          essential: false
          installed_size: 50000
          icon: assets/logo.png
          keywords:
            - Developer
            - Coding
            - Productivity
            - Programming
          generic_name: Developer Productivity App
          categories:
            - Development
            - Utility
          startup_notify: true
          EOF

          cat > linux/packaging/rpm/make_config.yaml <<'EOF'
          icon: assets/logo.png
          summary: AI-driven daily coding sprint engine
          group: Development/Tools
          vendor: thetwodigiter
          packager: thetwodigiter
          packager_email: thetwodigiter@users.noreply.github.com
          license: Proprietary
          url: https://github.com/thetwodigiter/DevSprint
          display_name: DevSprint
          keywords:
            - Developer
            - Coding
            - Productivity
            - Programming
          generic_name: Developer Productivity App
          categories:
            - Development
            - Utility
          startup_notify: true
          EOF

          cat > linux/packaging/appimage/make_config.yaml <<'EOF'
          display_name: DevSprint
          icon: assets/logo.png
          keywords:
            - Developer
            - Coding
            - Productivity
            - Programming
          generic_name: Developer Productivity App
          categories:
            - Development
            - Utility
          startup_notify: true
          include: []
          EOF

      - name: Build DEB package
        shell: bash
        run: |
          set +e
          fastforge package --platform linux --targets deb
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::warning::DEB package failed. Continuing with the remaining Linux artifacts."
          else
            echo "DEB package built successfully."
          fi

      - name: Build RPM package
        shell: bash
        run: |
          set +e
          fastforge package --platform linux --targets rpm
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::warning::RPM package failed. Continuing with the remaining Linux artifacts."
          else
            echo "RPM package built successfully."
          fi

      - name: Build AppImage package
        shell: bash
        run: |
          set +e
          fastforge package --platform linux --targets appimage
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::warning::AppImage package failed. Continuing with the remaining Linux artifacts."
          else
            echo "AppImage package built successfully."
          fi

      - name: Build portable Linux archive
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist
          tar -C build/linux/x64/release \
            -czf "dist/DevSprint-v${{ needs.version.outputs.version }}-linux-x64.tar.gz" \
            bundle

      - name: Collect available Linux artifacts
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release-assets/linux

          shopt -s nullglob

          for file in dist/*.deb dist/*.rpm dist/*.AppImage dist/*.tar.gz; do
            cp "$file" release-assets/linux/
          done

          for file in dist/*/devsprint-*.deb dist/*/devsprint-*.rpm dist/*/devsprint-*.AppImage; do
            cp "$file" release-assets/linux/
          done

          if [[ -z "$(find release-assets/linux -maxdepth 1 -type f -print -quit)" ]]; then
            echo "::error::No Linux release artifact was produced."
            exit 1
          fi

          echo "Available Linux artifacts:"
          find release-assets/linux -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-x64
          path: release-assets/linux/*
          if-no-files-found: error

  build-pacman:
    name: Linux Arch Pacman package
    needs: [version, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download Linux bundle
        uses: actions/download-artifact@v4
        with:
          name: linux-release-x64
          path: release-assets/linux

      - name: Restore Linux bundle for Arch packaging
        shell: bash
        run: |
          set -euo pipefail

          archive="$(find release-assets/linux -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"

          if [[ -z "$archive" ]]; then
            echo "::warning::Linux portable archive is unavailable; Pacman packaging will be skipped."
            exit 0
          fi

          mkdir -p build/linux/x64/release
          tar -xzf "$archive" -C build/linux/x64/release

          test -x build/linux/x64/release/bundle/DevSprint

      - name: Build Pacman package in Arch Linux
        shell: bash
        run: |
          set -u

          mkdir -p release-assets/pacman

          if docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            archlinux:latest \
            bash -lc '
              set -euo pipefail

              pacman -Sy --noconfirm --needed base-devel gtk3 libsecret jsoncpp

              useradd --create-home builder
              chown -R builder:builder /workspace

              su - builder -c "
                set -euo pipefail
                cd /workspace
                rm -rf pacman-build
                mkdir -p pacman-build/pkg

                cat > pacman-build/PKGBUILD <<'\''PKGEOF'\''
                pkgname=devsprint
                pkgver=${{ needs.version.outputs.version }}
                pkgrel=1
                pkgdesc="AI-driven daily coding sprint engine"
                arch=("x86_64")
                url="https://github.com/thetwodigiter/DevSprint"
                license=("custom")
                depends=("gtk3" "libsecret" "jsoncpp")

                package() {
                  install -dm755 "\$pkgdir/opt/DevSprint"
                  cp -a /workspace/build/linux/x64/release/bundle/. "\$pkgdir/opt/DevSprint/"

                  install -dm755 "\$pkgdir/usr/bin"
                  ln -s /opt/DevSprint/DevSprint "\$pkgdir/usr/bin/devsprint"

                  install -dm755 "\$pkgdir/usr/share/applications"
                  cat > "\$pkgdir/usr/share/applications/devsprint.desktop" <<'\''DESKEOF'\''
                [Desktop Entry]
                Type=Application
                Name=DevSprint
                GenericName=Developer Productivity App
                Comment=AI-driven daily coding sprint engine
                Exec=devsprint %U
                Icon=devsprint
                Categories=Development;Utility;
                Keywords=Developer;Coding;Productivity;Programming;
                StartupNotify=true
                DESKEOF

                  install -dm755 "\$pkgdir/usr/share/icons/hicolor/128x128/apps"
                  install -dm755 "\$pkgdir/usr/share/icons/hicolor/256x256/apps"

                  if [[ -f /workspace/assets/logo.png ]]; then
                    install -Dm644 /workspace/assets/logo.png "\$pkgdir/usr/share/icons/hicolor/128x128/apps/devsprint.png"
                    install -Dm644 /workspace/assets/logo.png "\$pkgdir/usr/share/icons/hicolor/256x256/apps/devsprint.png"
                  fi
                }
                PKGEOF

                cd pacman-build
                makepkg --clean --force
                cp ./*.pkg.tar.zst /workspace/release-assets/pacman/
              "
            '; then
            echo "Pacman package built successfully."
          else
            echo "::warning::Pacman package could not be built. Continuing without it."
          fi

      - name: Upload Pacman artifact if available
        uses: actions/upload-artifact@v4
        with:
          name: linux-pacman-x64
          path: release-assets/pacman/*
          if-no-files-found: ignore

  build-windows:
    name: Windows x64 release
    needs: version
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType File -Path .env -Force | Out-Null
          flutter config --enable-windows-desktop
          flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Package Windows release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Compress-Archive `
            -Path 'build/windows/x64/runner/Release/*' `
            -DestinationPath "dist/DevSprint-v${{ needs.version.outputs.version }}-windows-x64.zip" `
            -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-x64
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [version, build-android, build-linux, build-pacman, build-windows]
    if: always() && needs.version.result == 'success' && needs.build-android.result == 'success' && needs.build-linux.result == 'success' && needs.build-windows.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-release-apks
          path: release-assets/android

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-release-x64
          path: release-assets/linux

      - name: Download Pacman artifact if available
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: linux-pacman-x64
          path: release-assets/pacman

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release-x64
          path: release-assets/windows

      - name: List release assets
        shell: bash
        run: |
          set -euo pipefail

          echo "Release assets:"
          find release-assets -type f -print | sort

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t assets < <(find release-assets -type f -print | sort)

          if (( ${#assets[@]} == 0 )); then
            echo "::error::No release assets were collected."
            exit 1
          fi

          printf 'Publishing %s with %d asset(s).\n' \
            "${{ needs.version.outputs.release_tag }}" \
            "${#assets[@]}"

          tag="${{ needs.version.outputs.release_tag }}"

          if gh release view "$tag" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release $tag already exists. Updating its assets."
            gh release upload \
              "$tag" \
              "${assets[@]}" \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          else
            echo "Creating release $tag."
            gh release create \
              "$tag" \
              "${assets[@]}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "DevSprint $tag" \
              --generate-notes
          fi

          echo "GitHub Release published successfully."
