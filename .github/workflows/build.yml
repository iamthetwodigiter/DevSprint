name: Build release artifacts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Android release APKs
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Android signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64 repository secret"; exit 1; }
          test -n "$ANDROID_STORE_PASSWORD" || { echo "Missing ANDROID_STORE_PASSWORD repository secret"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "Missing ANDROID_KEY_PASSWORD repository secret"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Missing ANDROID_KEY_ALIAS repository secret"; exit 1; }
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/devsprint-upload.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=devsprint-upload.jks
          EOF

      - name: Prepare dependencies
        shell: bash
        run: |
          touch .env
          flutter pub get

      - name: Build release APKs
        run: flutter build apk --release --split-per-abi

      - name: Rename APKs
        shell: bash
        run: |
          version=$(sed -n "s/^version: \([0-9][0-9.]*\).*/\1/p" pubspec.yaml | head -n 1)
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "dist/DevSprint-v${version}-armeabi-v7a.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/DevSprint-v${version}-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk "dist/DevSprint-v${version}-x86_64.apk"

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apks
          path: dist/*.apk
          if-no-files-found: error


      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f android/key.properties android/app/devsprint-upload.jks

  build-linux:
    name: Linux x64 release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev libjsoncpp-dev libsecret-1-0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare dependencies
        run: |
          touch .env
          flutter config --enable-linux-desktop
          flutter pub get

      - name: Build Linux release
        run: flutter build linux --release

      - name: Package Linux release
        shell: bash
        run: |
          version=$(sed -n "s/^version: \([0-9][0-9.]*\).*/\1/p" pubspec.yaml | head -n 1)
          mkdir -p dist
          tar -C build/linux/x64/release -czf "dist/DevSprint-v${version}-linux-x64.tar.gz" bundle

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-x64
          path: dist/*.tar.gz
          if-no-files-found: error

  build-windows:
    name: Windows x64 release
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare dependencies
        shell: pwsh
        run: |
          New-Item -ItemType File -Path .env -Force | Out-Null
          flutter config --enable-windows-desktop
          flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Package Windows release
        shell: pwsh
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern '^version: ([0-9.]+)' | Select-Object -First 1).Matches.Groups[1].Value
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Compress-Archive -Path 'build/windows/x64/runner/Release/*' -DestinationPath "dist/DevSprint-v$version-windows-x64.zip" -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-x64
          path: dist/*.zip
          if-no-files-found: error
